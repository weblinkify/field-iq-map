name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared:
    name: Shared fixtures
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Fixture is up to date
        run: npm run check
      - run: npm test

  api:
    name: API (Spring Boot)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Format check (Spotless / google-java-format)
        run: ./mvnw -B spotless:check
      - name: Build, unit + Testcontainers integration tests, JaCoCo (>= 80%)
        run: ./mvnw -B verify
      - name: OpenAPI / GraphQL snapshot drift check
        # OpenApiSnapshotTest already fails on drift; this guards against tests being skipped.
        run: |
          ./mvnw -B -q test -Dtest='OpenApiSnapshotTest,GraphQlSchemaSnapshotTest' -Dcontract.update=true -Djacoco.skip=true
          git diff --exit-code -- ../../shared/openapi/openapi.yaml src/test/resources/snapshots/
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: services/api/target/site/jacoco/
          if-no-files-found: ignore

  web:
    name: Web (Angular)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: GraphQL + OpenAPI codegen is committed and in sync
        run: |
          npm run codegen
          git diff --exit-code -- src/app/api/generated
      - run: npm run lint
      - name: Unit tests with coverage
        run: npm run test:ci
      - name: Production build
        run: npm run build
      - name: E2E build (test hooks enabled)
        run: npx ng build --configuration e2e --output-path dist/web-e2e

  mock-api:
    name: Mock API
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/mock-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/mock-api/package-lock.json
      - run: npm ci
      - name: Generated types are in sync with shared/ contracts
        run: |
          npm run codegen
          git diff --exit-code -- src/generated
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build
