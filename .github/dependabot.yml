version: 2
updates:
  - package-ecosystem: maven
    directory: /services/api
    schedule: { interval: weekly }
    groups:
      spring: { patterns: ['org.springframework*', 'org.springdoc*'] }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups:
      angular: { patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint'] }
      graphql-codegen: { patterns: ['@graphql-codegen/*'] }
  - package-ecosystem: npm
    directory: /services/mock-api
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /shared
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/apps/web, /services/api, /services/mock-api]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
