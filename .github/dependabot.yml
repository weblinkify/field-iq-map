# Minor/patch updates are grouped into one PR per ecosystem and directory. Major versions are
# ignored: they need coordinated upgrades (TypeScript ↔ Angular/openapi-typescript, graphql ↔
# codegen, Node/Java LTS lines) and are done by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      web: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /services/mock-api
    schedule: { interval: weekly }
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      mock-api: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /shared
    schedule: { interval: weekly }
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      shared: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      e2e: { patterns: ['*'] }
  - package-ecosystem: maven
    directory: /services/api
    schedule: { interval: weekly }
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      api: { patterns: ['*'] }
  - package-ecosystem: docker
    directories: [/apps/web, /services/api, /services/mock-api]
    schedule: { interval: weekly }
    ignore:
      # Stay on LTS lines: Node 24, Java 21.
      - dependency-name: node
        update-types: ['version-update:semver-major']
      - dependency-name: eclipse-temurin
        update-types: ['version-update:semver-major']
      - dependency-name: maven
        versions: ['>= 3.9-eclipse-temurin-22']
    groups:
      docker: { patterns: ['*'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ['*'] }
