spring:
  application:
    name: fieldiq-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/fieldiq}
    username: ${DATABASE_USER:fieldiq}
    password: ${DATABASE_PASSWORD:fieldiq}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  graphql:
    graphiql:
      enabled: true
    schema:
      printer:
        enabled: true

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/geo+json,text/csv,application/graphql-response+json
    min-response-size: 2048
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**

fieldiq:
  seed:
    enabled: ${FIELDIQ_SEED_ENABLED:true}
    force: ${FIELDIQ_SEED_FORCE:false}
    history-hours: ${FIELDIQ_SEED_HISTORY_HOURS:24}
    exit-after-seed: ${FIELDIQ_EXIT_AFTER_SEED:false}
  simulator:
    enabled: ${FIELDIQ_SIMULATOR_ENABLED:true}
    interval: ${FIELDIQ_SIMULATOR_INTERVAL:30s}
