type Alert {
  createdAt: DateTime!
  id: ID!
  message: String!
  resolvedAt: DateTime
  sensorId: ID!
  sensorName: String!
  severity: AlertSeverity!
}

"WGS84 coordinates (EPSG:4326)."
type Coordinates {
  lat: Float!
  lon: Float!
}

type MetricAverage {
  "Average of the latest readings, null when no sensor in scope measures the metric."
  average: Float
  metric: Metric!
  sampleSize: Int!
  unit: String!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

type Query {
  alerts(activeOnly: Boolean = true, first: Int = 100): [Alert!]!
  regions: [RegionSummary!]!
  sensor(id: ID!): Sensor
  "Counts by status/type and averages of the latest readings."
  sensorStats(bbox: BBoxInput, filter: SensorFilter): SensorStats!
  "Cursor-paginated, ordered by id. first defaults to 20 (max 200)."
  sensors(after: String, bbox: BBoxInput, filter: SensorFilter, first: Int = 20): SensorConnection!
  sites(region: String): [Site!]!
}

type Reading {
  metric: Metric!
  sensorId: ID!
  ts: DateTime!
  unit: String!
  value: Float!
}

type RegionSummary {
  alertCount: Int!
  onlineCount: Int!
  region: String!
  sensorCount: Int!
}

type Sensor {
  alerts(activeOnly: Boolean = false): [Alert!]!
  batteryPct: Int!
  firmware: String!
  "Stable identifier, e.g. FIQ-00042"
  id: ID!
  installedAt: DateTime!
  lastSeenAt: DateTime!
  "Most recent value for every metric this sensor measures."
  latestReadings: [Reading!]!
  location: Coordinates!
  municipality: String!
  name: String!
  "Hourly history. Defaults to the last 24 hours, all metrics."
  readings(from: DateTime, metric: Metric, to: DateTime): [Reading!]!
  "Region (maakunta)"
  region: String!
  site: Site!
  siteName: String!
  status: SensorStatus!
  type: SensorType!
}

type SensorConnection {
  edges: [SensorEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type SensorEdge {
  cursor: String!
  node: Sensor!
}

type SensorStats {
  activeAlerts: Int!
  averages: [MetricAverage!]!
  byStatus: [StatusCount!]!
  byType: [TypeCount!]!
  regionsCovered: Int!
  total: Int!
}

type Site {
  id: ID!
  location: Coordinates!
  municipality: String!
  name: String!
  region: String!
  sensorCount: Int!
}

type StatusCount {
  count: Int!
  status: SensorStatus!
}

type TypeCount {
  count: Int!
  type: SensorType!
}

enum AlertSeverity {
  CRITICAL
  WARNING
}

enum Metric {
  HUMIDITY
  NOISE
  PM25
  TEMPERATURE
}

enum SensorStatus {
  ALERT
  LOW_BATTERY
  OFFLINE
  ONLINE
}

enum SensorType {
  AIR_QUALITY_PM25
  HUMIDITY
  MULTI
  NOISE
  TEMPERATURE
}

"ISO-8601 timestamp in UTC"
scalar DateTime

"Bounding box in WGS84. lon -180..180, lat -90..90, min < max."
input BBoxInput {
  maxLat: Float!
  maxLon: Float!
  minLat: Float!
  minLon: Float!
}

input SensorFilter {
  regions: [String!]
  "Case-insensitive match on id, name, municipality or site name."
  search: String
  statuses: [SensorStatus!]
  types: [SensorType!]
}
